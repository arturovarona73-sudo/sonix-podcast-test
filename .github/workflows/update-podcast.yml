name: Update Sonix podcast feeds

on:
  schedule:
    - cron: '17 5 * * *' # Every day around 05:17 UTC (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download, trim and validate Omny RSS
        run: python scripts/update_feed.py public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload RSS files to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish refreshed RSS files
        id: deployment
        uses: actions/deploy-pages@v4
